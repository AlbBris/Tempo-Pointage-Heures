name: Installer Tempo V1
on:
  push:
    branches: [main]
    paths:
      - tempo_bundle.b64
permissions:
  contents: write
jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraire le bundle de l'application
        run: |
          base64 -d tempo_bundle.b64 > /tmp/tempo.tar.gz
          tar -xzf /tmp/tempo.tar.gz
          rm tempo_bundle.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publier Tempo V1' || true
          git push
