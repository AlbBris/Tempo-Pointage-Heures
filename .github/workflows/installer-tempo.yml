name: Installer Tempo V1
on:
  push:
    branches: [main]
    paths:
      - tempo_bundle.b64
permissions:
  contents: write
jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraire le bundle de l'application
        run: |
          cat tempo_part_* > /tmp/tempo_bundle.b64
          base64 -d /tmp/tempo_bundle.b64 > /tmp/tempo.tar.xz
          tar -xJf /tmp/tempo.tar.xz
          rm tempo_bundle.b64 tempo_part_*
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publier Tempo V1' || true
          git push
